<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Cookie Consent</title>
  </head>
  <body>
    <main>
      <div class="greeting">
        <h1 class="greeting-title">Welcome to Our Website</h1>
        <p class="greeting-description">
          We use cookies to keep our site reliable, secure, and personalized for
          you.
        </p>
      </div>

      <div
        id="cookieBanner"
        class="card"
        role="dialog"
        aria-describedby="cookieDescription"
      >
        <div class="card-header">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            xml:space="preserve"
            viewBox="0 0 512 512"
            class="cookie-icon"
            aria-hidden="true"
          >

            />
          </svg>
          <button
            class="close-button"
            type="button"
            aria-label="Close cookie consent"
          >
            <span class="close-icon" aria-hidden="true"></span>
          </button>
        </div>

        <div class="card-body">
          <p id="cookieDescription" class="description">
            We use cookies to improve your experience on our site.
          </p>
        </div>

        <div class="card-footer">
          <button type="button" class="cookie-button">Accept Cookies</button>
        </div>
      </div>
    </main>
    <script src="main.js"></script>
  </body>
</html>
